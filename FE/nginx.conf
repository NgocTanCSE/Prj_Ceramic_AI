worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # Writable temp paths for non-root nginx user
  client_body_temp_path /tmp/nginx_client;
  proxy_temp_path /tmp/nginx_proxy;
  fastcgi_temp_path /tmp/nginx_fastcgi;
  uwsgi_temp_path /tmp/nginx_uwsgi;
  scgi_temp_path /tmp/nginx_scgi;
  access_log /tmp/nginx_access.log;
  error_log /tmp/nginx_error.log;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss;

  server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets — cache aggressively (30d)
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|eot|ico)$ {
      expires 30d;
      add_header Cache-Control "public";
      try_files $uri =404;
    }

    # SPA fallback — serve index.html for all routes
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Disable caching for index.html (always fetch fresh)
    location = /index.html {
      expires -1;
      add_header Cache-Control "no-cache";
    }
  }
}
