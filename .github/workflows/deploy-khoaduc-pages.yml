name: Deploy GitHub Pages from khoaduc

on:
  push:
    branches:
      - khoaduc
      - khoaDuc
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages-khoaduc'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout khoaduc branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'FE/package-lock.json'

      - name: Install dependencies
        working-directory: FE
        run: npm ci

      - name: Run 3D Algorithm Test Suite
        run: node tools/test_3d_comprehensive.mjs

      - name: Build Frontend with base path
        working-directory: FE
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}
          VITE_AI_API_BASE_URL: ${{ vars.VITE_AI_API_BASE_URL || '' }}
        run: npm run build -- --base=/Prj_Ceramic_AI/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'FE/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
